<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{businessName}} - {{headline}}</title>
    <meta name="description" content="{{description}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        .hero {
            background: linear-gradient(135deg, {{primaryColor}} 0%, {{secondaryColor}} 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .hero p {
            font-size: 1.3em;
            max-width: 800px;
            margin: 0 auto 30px;
        }
        
        .cta-button {
            display: inline-block;
            background: {{accentColor}};
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2em;
            transition: transform 0.3s;
        }
        
        .cta-button:hover {
            transform: scale(1.05);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .feature-card {
            padding: 30px;
            background: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .feature-card h3 {
            color: {{primaryColor}};
            margin-bottom: 15px;
        }
        
        .contact-section {
            background: #f5f5f5;
            padding: 60px 20px;
        }
        
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .submit-btn {
            background: {{primaryColor}};
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
        }
        
        .submit-btn:hover {
            opacity: 0.9;
        }
        
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>{{businessName}}</h1>
        <p>{{headline}}</p>
        <a href="#contact" class="cta-button">{{ctaText}}</a>
    </div>
    
    <div class="container">
        <h2>Rólunk</h2>
        <p>{{description}}</p>
        
        <div class="features">
            {{#each features}}
            <div class="feature-card">
                <h3>✓ {{this}}</h3>
            </div>
            {{/each}}
        </div>
    </div>
    
    <div class="contact-section" id="contact">
        <div class="container">
            <h2 style="text-align: center; margin-bottom: 30px;">Kapcsolat</h2>
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Név *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefon</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Üzenet</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>
                <button type="submit" class="submit-btn">Küldés</button>
            </form>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2024 {{businessName}}. Minden jog fenntartva.</p>
        <p>Cím: {{address}}</p>
        <p>Telefon: {{phone}}</p>
    </footer>
    
    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                websiteId: '{{websiteId}}',
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value
            };
            
            try {
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    alert('Köszönjük üzenetét! Hamarosan felvesszük Önnel a kapcsolatot.');
                    e.target.reset();
                } else {
                    alert('Hiba történt. Kérjük próbálja újra.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hiba történt. Kérjük próbálja újra.');
            }
        });
    </script>
</body>
</html>
